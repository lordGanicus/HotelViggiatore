<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desayuno Buffet Continental</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Estilos generales y reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
      }

      /* Sección principal */
      .desy-section {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 5rem;
      }

      .desy-header {
        text-align: center;
        margin-bottom: 2rem;
        z-index: 10;
      }

      .desy-title {
        font-family: "Gloock-Regular", Georgia, serif;
        font-size: 2.5rem;
        font-weight: 400;
        color: #000000;
        margin-bottom: 1rem;
      }

      .desy-line {
        width: 100px;
        height: 2px;
        background-color: #000;
        margin: 0 auto;
        transform: scaleX(0);
        transition: transform 1s ease;
      }

      .desy-line.animate {
        transform: scaleX(1);
      }

      .desy-hero {
        position: relative;
        width: 100%;
        height: 33vh;
        overflow: hidden;
      }

      .desy-hero-image {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background-image: url("https://res.cloudinary.com/ddqoou1fq/image/upload/v1755178406/restaurant-2_wnzi9a.png");
        background-size: cover;
        background-position: center;
      }

      .desy-hero-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 0 1rem;
      }

      .desy-icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }

      .desy-subtitle {
        font-family: "Gentium Book Basic-Regular", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 400;
        margin-bottom: 1.5rem;
        max-width: 600px;
      }

      .desy-button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.7);
        color: white;
        padding: 0.8rem 1.5rem;
        border-radius: 12px;
        font-family: "Abhaya Libre ExtraBold-Regular", serif;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .desy-button:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: #ffffff;
      }

      /* Modal */
      .desy-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .desy-modal.active {
        display: flex;
        opacity: 1;
      }

      .desy-modal-content {
        position: relative;
        width: 90%;
        max-width: 800px;
        background-color: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      }

      .desy-close-button {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .desy-slider {
        position: relative;
        width: 100%;
        height: 400px;
      }

      .desy-slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .desy-slide.active {
        opacity: 1;
      }

      .desy-slide-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .desy-slider-controls {
        position: absolute;
        bottom: 15px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 10px;
        z-index: 5;
      }

      .desy-slider-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .desy-slider-dot.active {
        background-color: white;
      }

      .desy-slider-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 5;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .desy-slider-arrow.prev {
        left: 15px;
      }

      .desy-slider-arrow.next {
        right: 15px;
      }

      /* Responsive */
      @media (min-width: 768px) {
        .desy-title {
          font-size: 3.5rem;
        }

        .desy-hero {
          height: 50vh;
        }

        .desy-subtitle {
          font-size: 2rem;
        }
      }

      @media (min-width: 1024px) {
        .desy-title {
          font-size: 4rem;
        }

        .desy-hero {
          height: 66vh;
        }
      }
    </style>
  </head>
  <body>
    <!-- Sección principal -->
    <section class="desy-section">
      <header class="desy-header">
        <h1 class="desy-title">Desayuno Buffet Continental</h1>
        <div class="desy-line"></div>
      </header>

      <div class="desy-hero">
        <div class="desy-hero-image"></div>
        <div class="desy-hero-overlay">
          <i class="desy-icon fas fa-utensils"></i>
          <p class="desy-subtitle">
            Tu despertar merece variedad y calidad en cada bocado
          </p>
          <button class="desy-button" id="desy-open-modal">
            Ver más <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Modal -->
    <div class="desy-modal" id="desy-modal">
      <div class="desy-modal-content">
        <button class="desy-close-button" id="desy-close-modal">
          <i class="fas fa-times"></i>
        </button>

        <div class="desy-slider">
          <div class="desy-slide active">
            <img
              src="https://res.cloudinary.com/ddqoou1fq/image/upload/v1755178353/desayuno-buffet-01_bjaiji.png"
              alt="Desayuno buffet 1"
              class="desy-slide-image"
            />
          </div>
          <div class="desy-slide">
            <img
              src="https://res.cloudinary.com/ddqoou1fq/image/upload/v1755178372/desayuno-buffet-02_rlvpav.png"
              alt="Desayuno buffet 2"
              class="desy-slide-image"
            />
          </div>
          <div class="desy-slide">
            <img
              src="https://res.cloudinary.com/ddqoou1fq/image/upload/v1755178379/desayuno-buffet-03_scwllf.png"
              alt="Desayuno buffet 3"
              class="desy-slide-image"
            />
          </div>

          <button class="desy-slider-arrow prev">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button class="desy-slider-arrow next">
            <i class="fas fa-chevron-right"></i>
          </button>

          <div class="desy-slider-controls">
            <div class="desy-slider-dot active" data-slide="0"></div>
            <div class="desy-slider-dot" data-slide="1"></div>
            <div class="desy-slider-dot" data-slide="2"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Animación de la línea al hacer scroll
      document.addEventListener("DOMContentLoaded", function () {
        const line = document.querySelector(".desy-line");

        // Función para verificar si el elemento está en el viewport
        function isInViewport(element) {
          const rect = element.getBoundingClientRect();
          return (
            rect.top >= 0 &&
            rect.left >= 0 &&
            rect.bottom <=
              (window.innerHeight || document.documentElement.clientHeight) &&
            rect.right <=
              (window.innerWidth || document.documentElement.clientWidth)
          );
        }

        // Comprobar al cargar y al hacer scroll
        function checkLineAnimation() {
          if (isInViewport(line)) {
            line.classList.add("animate");
            window.removeEventListener("scroll", checkLineAnimation);
          }
        }

        window.addEventListener("scroll", checkLineAnimation);
        checkLineAnimation(); // Comprobar al cargar la página

        // Modal functionality
        const modal = document.getElementById("desy-modal");
        const openModalBtn = document.getElementById("desy-open-modal");
        const closeModalBtn = document.getElementById("desy-close-modal");

        openModalBtn.addEventListener("click", function () {
          modal.classList.add("active");
          document.body.style.overflow = "hidden"; // Prevenir scroll del body
        });

        closeModalBtn.addEventListener("click", function () {
          modal.classList.remove("active");
          document.body.style.overflow = "auto"; // Permitir scroll nuevamente
        });

        // Cerrar modal al hacer clic fuera del contenido
        modal.addEventListener("click", function (e) {
          if (e.target === modal) {
            modal.classList.remove("active");
            document.body.style.overflow = "auto";
          }
        });

        // Slider functionality
        const slides = document.querySelectorAll(".desy-slide");
        const dots = document.querySelectorAll(".desy-slider-dot");
        const prevBtn = document.querySelector(".desy-slider-arrow.prev");
        const nextBtn = document.querySelector(".desy-slider-arrow.next");
        let currentSlide = 0;

        function showSlide(index) {
          // Ocultar todas las slides
          slides.forEach((slide) => slide.classList.remove("active"));
          dots.forEach((dot) => dot.classList.remove("active"));

          // Mostrar la slide actual
          slides[index].classList.add("active");
          dots[index].classList.add("active");

          currentSlide = index;
        }

        // Navegación con botones
        prevBtn.addEventListener("click", function () {
          let newIndex = currentSlide - 1;
          if (newIndex < 0) newIndex = slides.length - 1;
          showSlide(newIndex);
        });

        nextBtn.addEventListener("click", function () {
          let newIndex = currentSlide + 1;
          if (newIndex >= slides.length) newIndex = 0;
          showSlide(newIndex);
        });

        // Navegación con dots
        dots.forEach((dot) => {
          dot.addEventListener("click", function () {
            const slideIndex = parseInt(this.getAttribute("data-slide"));
            showSlide(slideIndex);
          });
        });

        // Navegación con teclado
        document.addEventListener("keydown", function (e) {
          if (modal.classList.contains("active")) {
            if (e.key === "ArrowLeft") {
              let newIndex = currentSlide - 1;
              if (newIndex < 0) newIndex = slides.length - 1;
              showSlide(newIndex);
            } else if (e.key === "ArrowRight") {
              let newIndex = currentSlide + 1;
              if (newIndex >= slides.length) newIndex = 0;
              showSlide(newIndex);
            } else if (e.key === "Escape") {
              modal.classList.remove("active");
              document.body.style.overflow = "auto";
            }
          }
        });
      });
    </script>
  </body>
</html>
